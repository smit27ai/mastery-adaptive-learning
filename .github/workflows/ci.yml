name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Black
        run: black --check src tests

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest --cov=mastery --cov-report=term-missing --cov-fail-under=70

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scanning the checked-out tree rather than a commit range: the official action
      # derives a `<first>^..<last>` range, which has no parent to resolve on a
      # repository's very first push and fails there for reasons unrelated to secrets.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --verbose

  web:
    name: Student app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [quality]

    # A real Postgres, because the production path - Alembic migrations over asyncpg -
    # shares almost no code with the SQLite path the unit tests use. Smoke-testing the
    # image against SQLite proves the image starts; it does not prove the thing that
    # actually runs in production works.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mastery
          POSTGRES_PASSWORD: mastery
          POSTGRES_DB: mastery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mastery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: mastery:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image the way production starts it
        run: |
          # DATABASE_URL is deliberately the plain postgresql:// form a managed provider
          # hands out, so the driver rewrite is exercised rather than bypassed.
          docker run -d --name mastery-ci --network host \
            -e APP_ENV=production \
            -e AUTO_CREATE_SCHEMA=false \
            -e DATABASE_URL=postgresql://mastery:mastery@localhost:5432/mastery \
            -e JWT_SECRET=ci-secret-not-used-anywhere-real \
            -e DEMO_PASSWORD=ci-demo-password \
            -e SEED_DEMO_DATA=true \
            -e CORS_ORIGINS=http://localhost:3000 \
            mastery:ci

          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "Container is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Container never became healthy"
          docker logs mastery-ci
          exit 1

      - name: Verify it is actually talking to Postgres
        run: |
          set -e
          # /ready reports each dependency, so a degraded database shows up here rather
          # than as mysteriously empty responses later.
          READY=$(curl -fsS http://localhost:8000/ready)
          echo "$READY"
          echo "$READY" | grep -q '"database":"ok"'
          echo "$READY" | grep -q '"ready":true'

      - name: Exercise the learning loop end to end
        run: |
          set -e
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.local","password":"ci-password-123"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')

          QUESTION=$(curl -fsS http://localhost:8000/next-question -H "Authorization: Bearer $TOKEN")
          echo "$QUESTION"
          QID=$(echo "$QUESTION" | python -c 'import json,sys; print(json.load(sys.stdin)["question"]["id"])')

          RESULT=$(curl -fsS -X POST http://localhost:8000/submit-answer \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"question_id\": $QID, \"answer\": \"a\", \"response_time_ms\": 5000}")
          echo "$RESULT"
          echo "$RESULT" | python -c 'import json,sys; b=json.load(sys.stdin); assert "mastery_after" in b, b'

      - name: Container logs
        if: always()
        run: docker logs mastery-ci

  # No deploy job here on purpose. Railway and Vercel each build from their own GitHub
  # integration when main moves, so a deploy step in this workflow would either duplicate
  # that or - as the placeholder it replaced did - report a successful production
  # deployment for doing nothing at all.
