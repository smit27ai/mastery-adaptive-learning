[project]
name = "mastery"
version = "0.1.0"
description = "Mastery - an adaptive learning engine that models what a student knows"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "redis>=5.2",
    "pyjwt>=2.10",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "numpy>=1.26",
    "httpx>=0.28",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.2",
    "polars>=1.12",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "optuna>=4.0",
    "shap>=0.46",
    "torch>=2.5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "sentence-transformers>=3.3",
    "mlflow>=2.18",
    "evidently>=0.4",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "locust>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mastery"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
# No python_version pin: mypy then checks against whatever interpreter is running,
# which keeps third-party stubs (numpy in particular) consistent with the installed wheels.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
